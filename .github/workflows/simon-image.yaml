name: Build and publish the Simon image

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: simon-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # The SvelteKit build needs more heap than Node's default (~4 GB) or it
      # aborts with exit code 134. Upstream does the same injection in its CI.
      - name: Prepare CI Dockerfile (raise the Node heap limit for the frontend build)
        run: |
          awk '
            /^FROM --platform=\$BUILDPLATFORM node:/ {
              print
              print "ENV NODE_OPTIONS=\"--max-old-space-size=12288\""
              next
            }
            { print }
          ' Dockerfile > "${RUNNER_TEMP}/Dockerfile"
          grep -n NODE_OPTIONS "${RUNNER_TEMP}/Dockerfile"

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ runner.temp }}/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            BUILD_HASH=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
